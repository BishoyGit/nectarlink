name: NectarDrop build

on:
  push:
    branches:
      - copilot/nectardrop-actions-build
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nectardrop-windows-x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/install-nsis.ps1
      - name: Build the installer
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify the desktop window starts
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP ('nectardrop-ui-check-' + [guid]::NewGuid().ToString('N'))
          & .\target\release\nectarlink-desktop.exe --ui-check --data-dir $data
          if ($LASTEXITCODE -ne 0) { throw "NectarDrop UI check failed: exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: nectardrop-windows-x64
          path: target/package/*-setup.exe
          if-no-files-found: error
          retention-days: 7
